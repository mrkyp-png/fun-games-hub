<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>그림맞추기</title>
<link rel="stylesheet" href="../cosmic-theme.css">
<style>
  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    gap: 18px;
    text-align: center;
    padding: 20px;
  }
  .placeholder-emoji { font-size: 4rem; }
  .placeholder-title { font-size: 1.5rem; font-weight: 700; margin: 0; }
  .placeholder-desc { color: var(--muted); margin: 0; }
  .back-btn {
    margin-top: 12px;
    padding: 12px 28px;
    border-radius: 999px;
    border: none;
    background: var(--brand);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="cosmic-bg">
  <div class="placeholder cosmic-content">
    <div class="placeholder-emoji">🧩</div>
    <h1 class="placeholder-title">그림맞추기</h1>
    <p class="placeholder-desc">준비 중이에요. 곧 만나요!</p>
    <a class="back-btn" href="../index.html">← 허브로</a>
  </div>
</div>
</body>
</html>
