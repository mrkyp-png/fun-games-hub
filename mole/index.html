<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두더지 게임</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../cosmic-theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cosmic-bg">

  <!-- 레벨 선택 화면 -->
  <section id="level-select-screen" class="screen cosmic-content">
    <header class="screen-header">
      <a class="icon-btn" href="../index.html" aria-label="허브로">←</a>
      <h1>🦫 두더지 게임</h1>
    </header>
    <div id="level-grid" class="level-grid"></div>
  </section>

  <!-- 플레이 화면 -->
  <section id="game-screen" class="screen cosmic-content" hidden>
    <div class="game-hud">
      <button id="btn-back-to-hub" class="icon-btn" aria-label="나가기">←</button>
      <div class="hud-mid">
        <span id="hud-level">Level 1</span>
        <span id="hud-hearts">❤️❤️❤️</span>
        <span id="hud-time">60초</span>
        <span id="hud-combo"></span>
        <span id="hud-score">0점</span>
        <span id="hud-region-count">0 / 9</span>
      </div>
    </div>
    <div id="mole-board" class="mole-board">
      <img id="mole-emoji-img" class="mole-board-layer" alt="">
      <canvas id="mole-reveal-canvas" class="mole-board-layer"></canvas>
      <div id="mole-sky" aria-hidden="true">
        <span class="mole-cloud mole-cloud--1"></span>
        <span class="mole-cloud mole-cloud--2"></span>
      </div>
      <div id="mole-hole-layer" class="mole-board-layer"></div>
      <div id="mole-pop-layer" class="mole-board-layer"></div>
      <div id="mole-hole-front-layer" class="mole-board-layer"></div>
      <div id="mole-hammer-layer" class="mole-board-layer"></div>
    </div>
    <div id="fold-hinge" aria-hidden="true"></div>
    <div id="lane-button-bar"></div>
  </section>

  <!-- 클리어 오버레이 -->
  <div id="clear-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2>🎉 STAGE CLEAR</h2>
      <div id="clear-stars" class="stars">⭐⭐⭐</div>
      <p id="clear-score">0점</p>
      <p id="clear-coins">🪙 0</p>
      <div class="overlay-btn-row">
        <button id="clear-retry-btn">다시하기</button>
        <button id="clear-select-btn">레벨 선택</button>
        <button id="clear-next-btn">다음 레벨</button>
      </div>
    </div>
  </div>

  <!-- 실패 오버레이 -->
  <div id="gameover-overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2>GAME OVER</h2>
      <p id="gameover-level">Level 1</p>
      <p id="gameover-reason">시간 초과</p>
      <div class="overlay-btn-row">
        <button id="gameover-retry-btn">다시하기</button>
        <button id="gameover-select-btn">레벨 선택</button>
      </div>
    </div>
  </div>

</div>

<script src="js/levels.js"></script>
<script src="js/rng.js"></script>
<script src="js/combo-score.js"></script>
<script src="js/grid-partition.js"></script>
<script src="js/spawn-scheduler.js"></script>
<script src="js/mole-sprites.js"></script>
<script src="js/pop-elements.js"></script>
<script src="js/hole-layer.js"></script>
<script src="js/hit-fx.js"></script>
<script src="js/lane-hammer.js"></script>
<script src="js/lane-controls.js"></script>
<script src="js/region-reveal.js"></script>
<script src="js/hud.js"></script>
<script src="js/game.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    // 미리보기(localhost)에서는 서비스워커를 쓰지 않는다 — 캐시가 옛 파일을 붙잡아 수정이 안 보이는 문제 방지.
    // 이미 등록돼 있으면 해제한다. 배포(GitHub Pages)에서만 PWA 로 동작.
    var local = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1 ||
      /^192\.168\./.test(location.hostname);
    window.addEventListener('load', function () {
      if (local) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      } else {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    });
  }
</script>
</body>
</html>
