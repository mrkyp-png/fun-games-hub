<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title data-i18n="mole.title">두더지 게임</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="../cosmic-theme.css">
<link rel="stylesheet" href="../common/settings.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cosmic-bg">

  <audio id="bgm" loop preload="auto" src="audio/bgm-boss-battle.mp3"></audio>

  <!-- 화면은 하나 = 폴더폰. 시작 UI·카운트다운·라운드완료·결과 모두 게임 박스(#mole-board) 안에서 뜬다
       (게임 화면이 휴대폰 컨셉이라 — 사용자 요청). is-start 클래스가 붙어있으면 시작 상태. -->
  <section id="game-screen" class="screen cosmic-content is-start">
    <div class="game-hud">
      <button id="btn-back-to-hub" class="icon-btn" aria-label="나가기" data-i18n-aria-label="common.back"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2.2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2.2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2.2"/></svg></button>
      <!-- 시작 상태: 브라우저 주소창 (게임 URL). 플레이 상태: 증권 전광판 스타일 티커. -->
      <div id="hud-addr" class="hud-addr" aria-hidden="true">
        <svg class="hud-addr-lock" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3z"/></svg>
        <span class="hud-addr-url">두더지게임.app</span>
      </div>
      <div id="hud-ticker" aria-hidden="true">
        <span class="tk-search">🔍</span>
        <div class="ticker-viewport">
          <div class="ticker-track">
            <span class="ticker-seg">
              <b class="tk-mode"></b><i class="tk-lv"></i><i class="tk-t"></i><i class="tk-c"></i>
            </span>
            <span class="ticker-seg">
              <b class="tk-mode"></b><i class="tk-lv"></i><i class="tk-t"></i><i class="tk-c"></i>
            </span>
          </div>
        </div>
      </div>
    </div>
    <div id="mole-board" class="mole-board">
      <img id="mole-emoji-img" class="mole-board-layer" alt="">
      <canvas id="mole-reveal-canvas" class="mole-board-layer"></canvas>
      <div id="mole-sky" aria-hidden="true"></div>
      <div id="mole-hole-layer" class="mole-board-layer"></div>
      <div id="mole-pop-layer" class="mole-board-layer"></div>
      <div id="mole-hole-front-layer" class="mole-board-layer"></div>
      <div id="mole-hammer-layer" class="mole-board-layer"></div>
      <div id="hud-score" aria-hidden="true">0</div>
      <div id="hud-hearts" class="board-hearts" aria-hidden="true"></div>
      <button id="btn-pause" type="button" aria-label="일시정지">
        <svg class="ic-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <div id="pause-veil" class="mole-board-layer" aria-hidden="true">일시정지</div>

      <!-- 시작 UI = 카톡풍 대화 (폰 화면 = 보드 안) -->
      <div id="build-tag" aria-hidden="true">v25</div>
      <div id="board-start" class="board-panel board-start">
        <!-- 최고 스코어: 위에서 툭 내려오는 문자 알림 -->
        <div id="start-best" class="chat-sms" aria-hidden="true">
          <svg class="chat-sms-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg>
          <span class="chat-sms-txt"></span>
          <svg class="chat-sms-party" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 21 8.5 8l7.5 7.5zm7.8-11.3 1.2-2.4 2.4-1.2-2.4-1.2L10.8 2 9.6 4.4 7.2 5.6l2.4 1.2zM19 11l.8-1.7 1.7-.8-1.7-.8L19 6l-.8 1.7-1.7.8 1.7.8zm2.5 3.5-1.2-.6-.6-1.2-.6 1.2-1.2.6 1.2.6.6 1.2.6-1.2z"/></svg>
        </div>

        <!-- 첫 방문: 전체 인트로 대화 -->
        <div class="chat-thread" id="chat-first">
          <div class="chat-row chat-row--them">
            <div class="chat-avatar chat-avatar--mole" aria-hidden="true"></div>
            <div class="chat-bubble chat-bubble--them">나 <b>두더지 오빠</b>야, 잘 지내지? ㅎㅎ</div>
          </div>
          <div class="chat-row chat-row--me">
            <div class="chat-bubble chat-bubble--me">누구세요?</div>
            <div class="chat-avatar chat-avatar--hippo" aria-hidden="true"></div>
          </div>
          <div class="chat-row chat-row--them">
            <div class="chat-avatar chat-avatar--mole" aria-hidden="true"></div>
            <div class="chat-bubble chat-bubble--them">게임 간단히 설명해줄게!</div>
          </div>
          <div class="chat-row chat-row--them">
            <div class="chat-avatar chat-avatar--spacer" aria-hidden="true"></div>
            <div class="chat-bubble chat-bubble--them">10개 라운드, 각 30초! 두더지를 최대한 많이 때려서 점수를 획득해야 돼. 쉽지?</div>
          </div>
          <div class="chat-row chat-row--them">
            <div class="chat-avatar chat-avatar--spacer" aria-hidden="true"></div>
            <div class="chat-bubble chat-bubble--them">자기야 사랑해~~</div>
          </div>
          <div class="chat-row chat-row--me">
            <div class="chat-bubble chat-bubble--me">하아.....뭐지? ... ...</div>
            <button id="start-btn" class="chat-start-btn" data-i18n="mole.start.btn">시작</button>
            <div class="chat-avatar chat-avatar--hippo" aria-hidden="true"></div>
          </div>
        </div>

        <!-- 재방문(재접·다시하기): game.js 가 상황에 맞춰 말풍선/이모티콘 줄을 채운다 -->
        <div class="chat-thread" id="chat-return" hidden></div>
      </div>

      <!-- 라운드 사이 안내 (1~9 클리어 시 잠깐 → 자동으로 다음 라운드) -->
      <div id="round-done-overlay" class="overlay board-panel" hidden aria-hidden="true">
        <div class="overlay-card">
          <h2 id="round-done-title">라운드 완료!</h2>
          <p id="round-done-total" class="clear-total"></p>
        </div>
      </div>

      <!-- 최종 결과 (10라운드 완주 또는 목숨 소진) -->
      <div id="gameover-overlay" class="overlay board-panel" hidden>
        <div class="overlay-card">
          <h2 id="gameover-reason">전체 클리어!</h2>
          <p id="gameover-score" class="gameover-score">0점</p>
          <p id="gameover-best" class="clear-total"></p>
          <div class="overlay-btn-row">
            <button id="gameover-retry-btn" data-i18n="common.retry">다시하기</button>
            <button id="gameover-select-btn" data-i18n="common.back">나가기</button>
          </div>
        </div>
      </div>

      <!-- 라운드 시작 카운트다운 (매 라운드: "라운드 N" → 3·2·1·시작!) -->
      <div id="round-intro-overlay" class="overlay round-intro board-panel" hidden aria-hidden="true">
        <div id="round-intro-title" class="round-intro-title">라운드 1</div>
        <div id="round-intro-count" class="round-intro-count">3</div>
      </div>
    </div>
    <div id="fold-hinge" aria-hidden="true"></div>
    <div id="lane-button-bar"></div>
  </section>

</div>

<script src="../common/settings.js"></script>
<script src="../common/i18n.js"></script>
<script src="js/i18n-strings.js"></script>
<script src="js/levels.js"></script>
<script src="js/rng.js"></script>
<script src="js/combo-score.js"></script>
<script src="js/grid-partition.js"></script>
<script src="js/spawn-scheduler.js"></script>
<script src="js/mole-sprites.js"></script>
<script src="js/pop-elements.js"></script>
<script src="js/hole-layer.js"></script>
<script src="js/hit-fx.js"></script>
<script src="js/lane-hammer.js"></script>
<script src="js/lane-controls.js"></script>
<script src="js/region-reveal.js"></script>
<script src="js/hud.js"></script>
<script src="js/sky.js"></script>
<script src="js/game.js"></script>
<script>window.FGH.I18N.applyStatic(document);</script>
<script>
  if ('serviceWorker' in navigator) {
    // 미리보기(localhost)에서는 서비스워커를 쓰지 않는다 — 캐시가 옛 파일을 붙잡아 수정이 안 보이는 문제 방지.
    // 이미 등록돼 있으면 해제한다. 배포(GitHub Pages)에서만 PWA 로 동작.
    var local = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1 ||
      /^192\.168\./.test(location.hostname);
    window.addEventListener('load', function () {
      if (local) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
        if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      } else {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    });
  }
</script>
</body>
</html>
