<!doctype html><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../mole/"><link rel="stylesheet" href="style.css"><link href="https://fonts.googleapis.com/css2?family=Dongle:wght@700&family=Jua&family=Lilita+One&display=swap" rel="stylesheet"><style>html,body{margin:0;background:#000}</style><style>
  /* 로딩 스플래시 — style.css 로딩 전에도 바로 뜨게 인라인. */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
    background: radial-gradient(circle at 50% 42%, #ffffff 0%, #fdf3e0 70%);
    transition: opacity 0.45s ease;
  }
  #splash img {
    width: min(78vw, 60vh); height: auto;
    filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.18));
    animation: splash-in 0.5s ease both;
    border-radius: 18px; /* v927: 사각 사진이라 모서리 둥글게 */
  }
  .splash-cta { position: relative; opacity: 0; transition: opacity 0.3s; }
  #splash.is-ready .splash-cta { opacity: 1; }
  /* V 1150 G: visible immediately, until the existing load gate is ready. */
  .splash-loading { position:absolute; left:50%; bottom:max(5vh,env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(68vw,300px); color:#fff; text-align:center; pointer-events:none; }
  .splash-loading-label { display:block; margin-bottom:10px; font:700 15px/1.4 'Jua',sans-serif; text-shadow:0 2px 4px #000; }
  .splash-loading-track { display:block; height:8px; overflow:hidden; border:1px solid #ffffff80; border-radius:999px; background:#00152b99; }
  .splash-loading-fill { display:block; width:35%; height:100%; border-radius:inherit; background:linear-gradient(90deg,#30cfff,#b8f5ff,#30cfff); animation:splash-loading-slide 1.3s ease-in-out infinite alternate; }
  #splash.is-ready .splash-loading { display:none; }
  @keyframes splash-loading-slide { from { transform:translateX(0); } to { transform:translateX(186%); } }
  @media(prefers-reduced-motion:reduce) { .splash-loading-fill { animation:none; width:100%; opacity:.7; } }
  .splash-hint {
    position: relative;
    padding: 16px 50px;
    border-radius: 999px;
    background: linear-gradient(180deg, #74e389 0%, #47cc6a 46%, #2ea951 100%);
    box-shadow:
      0 9px 0 #1c8340,                        /* 두꺼운 아래 단차 (눌리는 3D 버튼) */
      0 9px 2px rgba(0, 0, 0, 0.18),
      0 17px 22px rgba(0, 0, 0, 0.32),         /* 바닥 그림자 */
      inset 0 3px 3px rgba(255, 255, 255, 0.8),   /* 위쪽 안쪽 하이라이트 */
      inset 0 -7px 9px rgba(0, 80, 35, 0.4);      /* 아래쪽 안쪽 음영 */
    color: #fff;
    font: 900 clamp(18px, 5.4vw, 26px)/1 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    letter-spacing: 0.09em;
    text-shadow: 0 2px 0 rgba(0, 60, 25, 0.45), 0 1px 1px rgba(0, 0, 0, 0.3);
  }
  /* 윗면 광택 (사탕 버튼 느낌) */
  .splash-hint::before {
    content: '';
    position: absolute;
    left: 7%; right: 7%; top: 4px;
    height: 44%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0));
    pointer-events: none;
  }
  #splash.is-ready .splash-hint { animation: splash-cta-pulse 1.2s ease-in-out infinite; }
  @keyframes splash-cta-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  /* 누르면 쑥 들어간다 — 아래 단차(0 9px 0)가 줄고 버튼이 내려앉음.
     #splash 를 붙여 위 펄스 규칙(#splash.is-ready, ID 셀렉터)보다 우선순위를 높인다 —
     안 그러면 펄스의 animation(transform: scale) 이 계속 이겨서 translateY 가 무시되고,
     그림자만 줄어들어 "아래 진한 초록이 올라오는" 것처럼 보이는 버그가 있었다. */
  #splash .splash-cta.is-pressed .splash-hint {
    animation: none;
    transform: translateY(7px);
    box-shadow:
      0 2px 0 #1c8340,
      0 3px 3px rgba(0, 0, 0, 0.2),
      0 6px 9px rgba(0, 0, 0, 0.26),
      inset 0 3px 3px rgba(255, 255, 255, 0.7),
      inset 0 -5px 8px rgba(0, 80, 35, 0.45);
    transition: transform 0.09s ease, box-shadow 0.09s ease;
  }
  .splash-hand {
    position: absolute;
    right: -8px; bottom: -24px;
    font-size: clamp(45px, 13.5vw, 69px); /* v967(사용자 지정): 손 아이콘 1.5배 */
    filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
    pointer-events: none;
  }
  #splash.is-ready .splash-hand { animation: splash-tap 1.2s ease-in-out infinite; }
  @keyframes splash-tap {
    0%, 100% { transform: rotate(-22deg) translate(7px, 9px) scale(1); }
    50%      { transform: rotate(-22deg) translate(0, 0) scale(0.88); }
  }
  /* v928(사용자 지정): 크림 바탕 삭제 — 그림을 화면 가득, GET NOW 는 홈 리듬팡 보라 버튼 모양(캐릭터 없이), 누름 효과 */
  #splash { background: #000; justify-content: flex-end; padding-bottom: 12vh; }
  /* v930(사용자 지정): MOLE PANG 글자가 좌우로 잘리지 않게 — 그림은 가로 전체가 보이게(contain), 남는 위아래는 같은 그림을 흐리게 깔아 채움 */
  /* v931(사용자 지정): 오락실 배경 삭제 — 광고판·캐릭터만 남긴 그림, 바탕은 앱 흙 톤 */
  #splash { background: #0d3b66 url('assets/rhythm/bg-beach.jpg') center / cover no-repeat; } /* v934(사용자 지정): 로딩 바탕 = 리듬팡 바닷가 */
  #splash > img { position: absolute; left: 0; right: 0; top: 49%; width: 100%; height: auto; max-height: 100%; object-fit: contain; transform: translateY(-62%); border-radius: 0; filter: none; animation: none; }
  #splash .splash-hint { display: flex; align-items: center; justify-content: center; width: min(74vw, 340px); aspect-ratio: 520 / 220; padding: 0; box-sizing: border-box;
    border-radius: 0; background: url('assets/home2/wide-purple.png') center / 100% 100% no-repeat; box-shadow: none; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
    font: 400 clamp(22px, 7vw, 34px)/1 'Jua', 'Lilita One', sans-serif; letter-spacing: 0.02em; color: #fff; -webkit-text-stroke: 4px rgba(50, 10, 130, 0.8); paint-order: stroke fill; text-shadow: none; }
  #splash .splash-hint::before { display: none; }
  /* v929(사용자 지정): GET NOW 글자 = MOLE PANG 광고판 글자 형식(노랑→주황 그라데이션, 굵은 갈색 외곽선, 아래 두께) */
  .splash-txt { position: relative; font: 400 clamp(36px, 11.5vw, 54px)/1 'Lilita One', 'Jua', sans-serif; letter-spacing: 0.03em; -webkit-text-stroke: 0;
    color: transparent; background: linear-gradient(180deg, #fff9c4 0%, #ffe14a 38%, #ffb21e 70%, #ff8a00 100%); -webkit-background-clip: text; background-clip: text; }
  .splash-txt::before { content: attr(data-t); position: absolute; left: 0; top: 0; z-index: -1; color: #5a2a06; -webkit-text-stroke: 9px #5a2a06;
    text-shadow: 0 5px 0 #3a1803, 0 7px 6px rgba(0, 0, 0, 0.45); }
  #splash .splash-cta.is-pressed .splash-hint, #splash .splash-cta:active .splash-hint { animation: none; transform: translateY(5px) scale(0.94); box-shadow: none; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.4)) brightness(0.92); transition: transform 0.08s ease, filter 0.08s ease; }
  /* v967(사용자 지정): 광고판 줄을 화면 맨 위까지 — 그림 위쪽(하늘)에 같은 줄 무늬를 세로로 반복. 그림 높이 = 100vw*1961/1631, 위끝 = 49% - 62%*그림높이 */
  #splash::before, #splash::after { content: ''; position: absolute; top: 0; height: calc(49% - 74.55vw + 2px); width: calc(100vw * 63 / 1631);
    background: url('assets/home2/splash-rope.png') center bottom / 100% auto repeat-y; pointer-events: none; }
  #splash::before { left: calc(100vw * 392 / 1631); }
  #splash::after { left: calc(100vw * 1134 / 1631); }
  #splash.is-hiding { opacity: 0; pointer-events: none; }
  /* v1017(사용자 지정): 로딩 그림 동그라미 친 4곳에 여러 색 작은 하트 — 커졌다 작아졌다 + 반짝 */
  #splash .splash-hearts { position: absolute; left: 0; right: 0; top: 49%; aspect-ratio: 1631 / 1961; transform: translateY(-62%); pointer-events: none; z-index: 1; }
  #splash .splash-hearts i { position: absolute; width: 6.5%; aspect-ratio: 110 / 101; translate: -50% -50%; background: url('assets/mailbox/rw-heart.png') center / contain no-repeat;
    filter: hue-rotate(var(--h, 0deg)) drop-shadow(0 0 3px rgba(255, 255, 255, 0.9)); animation: splash-heart 1.6s ease-in-out infinite; }
  #splash .splash-hearts i::after { content: ''; position: absolute; right: -18%; top: -22%; width: 45%; aspect-ratio: 1; background: radial-gradient(circle, #fff 0 18%, rgba(255,255,255,0.8) 30%, rgba(255,255,255,0) 65%);
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: splash-heart-tw 1.6s ease-in-out infinite; animation-delay: inherit; }
  @keyframes splash-heart { 0%, 100% { transform: scale(0.75); } 50% { transform: scale(1.15); } }
  @keyframes splash-heart-tw { 0%, 35%, 100% { opacity: 0; transform: scale(0.3) rotate(0); } 55% { opacity: 1; transform: scale(1.1) rotate(45deg); } }
  #splash:not(.is-art) .splash-hearts { visibility: hidden; }
  /* V 1150 G: five lightweight notes share the loading artwork's coordinates. */
  #splash .splash-notes { position:absolute; left:0; right:0; top:49%; aspect-ratio:1631 / 1961; transform:translateY(-62%); pointer-events:none; z-index:1; }
  #splash .splash-note { position:absolute; width:7.5%; height:auto; overflow:visible; --note-float:clamp(6px,1.8vw,10px); animation:splash-note-float var(--note-duration) ease-in-out var(--note-delay) infinite; }
  @keyframes splash-note-float { 0%,100% { transform:translate(-50%,-50%) translateY(calc(var(--note-float) * -1)); } 50% { transform:translate(-50%,-50%) translateY(var(--note-float)); } }
  #splash:not(.is-art) .splash-notes { visibility:hidden; }
  #splash:not(.is-art) .splash-note, #splash.is-hiding .splash-note { animation-play-state:paused; }
  @media(prefers-reduced-motion:reduce) { #splash .splash-note { animation:none; transform:translate(-50%,-50%); } }
  /* v987(사용자 지정): 로딩 그림 4장이 다 준비되기 전엔 바탕색만 — 준비되면(최대 2초) 한 번에 표시 */
  #splash:not(.is-art) { background-image: none; }
  #splash:not(.is-art) > img, #splash:not(.is-art)::before, #splash:not(.is-art)::after, #splash:not(.is-art) .splash-cta { visibility: hidden; }
  @keyframes splash-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    #splash img, #splash.is-ready .splash-hint, #splash.is-ready .splash-hand { animation: none; }
  }
  /* 홈 진입 연출(사용자 지정, 2026-09-18): 완전 검은화면 → 정중앙 점에서 시작해 전체화면으로
     확장(휴대폰 켜지는 느낌). #power-on-dot 자체는 투명 원(0x0에서 시작)이고, 그 주위를
     9999px 짜리 검은 box-shadow 가 감싸 "나머지 전부 검게" 표현 — 원이 커질수록 뚫리는
     구멍처럼 아래 화면이 드러남(고전적 스포트라이트 리빌 기법, clip-path 역방향보다 안정적). */
  /* background 를 여기 두면 #power-on-dot 의 "구멍"(box-shadow 반대편 투명 영역)이 뚫려도
     바로 뒤의 이 검은 배경만 보여 리빌이 전혀 안 되는 버그였음(실측으로 발견) — 검은색은
     전부 #power-on-dot 의 box-shadow 하나로만 담당, 오버레이 자체는 투명. */
  /* ⚠️v633 에서 pointer-events:auto 로 바꿨다가 훨씬 큰 회귀버그(정상 게임 중 다이얼패드
     아무 버튼이나 눌러도 화면이 깨짐, 사용자 보고: "더큰 문제 생김")가 나서 되돌림 — 원인
     미상, 별도로 다시 조사 필요. 원래의 미세한 클릭통과 버그(홈 진입 첫 12초)보다 이쪽이
     훨씬 치명적이라 우선 원복. */
  /* v773(사용자 녹화로 원인 확인): 예전엔 검은막을 "커지는 점 + 9999px box-shadow"로 그렸는데, 폰 GPU가 이 거대한 레이어를
     감당하느라 확장 도중 홈 그림판을 한 프레임 통째로 빼먹어 번쩍였음. → 검은 판 1장 + 원형 구멍 마스크(--pr)로 교체. */
  @property --pr { syntax: '<length>'; inherits: false; initial-value: 0px; }
  #power-on-overlay { position: fixed; inset: 0; z-index: 9999; pointer-events: none; overflow: hidden; background: #000;
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent var(--pr), #000 calc(var(--pr) + 1.5px));
            mask: radial-gradient(circle at 50% 50%, transparent var(--pr), #000 calc(var(--pr) + 1.5px)); --pr: 0px; }
  #power-on-overlay.is-expand { --pr: var(--dot-max, 150vmax); transition: --pr 3s linear; } /* v827: 10초→3초(사용자 지정) */
  #power-on-dot { display: none; }

  /* V1160: keep loading art visible during the black-iris contraction. */
  #splash.is-closing { pointer-events:none; }
  #splash.is-closing .splash-stage,#splash.is-closing .splash-note,#splash.is-closing .splash-hearts i,#splash.is-closing .splash-hearts i::after { animation-play-state:paused; }

  /* V 1153 G: fixed original performers; only the wide stage pans horizontally. */
  #splash { overflow:hidden; background:#020415; isolation:isolate; }
  #splash::before { content:none; }
  #splash::after { inset:0; width:auto; height:auto; background:linear-gradient(180deg,#01031799,transparent 38%,#02031644 62%,#020316d9); z-index:0; }
  #splash .splash-stage { position:absolute; top:0; bottom:0; left:0; width:max(100vw,calc(100dvh * 2048 / 768)); background:url('assets/loading-cyber-v1153/stage.webp') center/100% 100% no-repeat; z-index:-1; animation:splash-stage-pan 60s ease-in-out infinite alternate; will-change:transform; pointer-events:none; }
  @keyframes splash-stage-pan { from { transform:translateX(calc(100vw - 100%)); } to { transform:translateX(0); } }
  #splash .splash-brand { position:absolute; left:8%; top:9%; width:84%; aspect-ratio:1631 / 885; overflow:hidden; z-index:1; pointer-events:none; }
  #splash .splash-brand img { display:block; width:100%; height:auto; max-height:none; border-radius:0; filter:none; animation:none; }
  #splash > img.splash-performers { left:0; right:0; top:45%; width:100%; max-height:none; height:auto; transform:none; z-index:1; }
  #splash .splash-hearts,#splash .splash-notes { inset:0; width:100%; height:100%; aspect-ratio:auto; transform:none; z-index:2; }
  #splash .splash-hearts i:nth-child(1) { left:12%!important; top:37%!important; }
  #splash .splash-hearts i:nth-child(2) { left:88%!important; top:38%!important; }
  #splash .splash-hearts i:nth-child(3) { left:33%!important; top:40%!important; }
  #splash .splash-hearts i:nth-child(4) { left:67%!important; top:40%!important; }
  #splash .splash-note:nth-of-type(2) { left:20%!important; top:34%!important; }
  #splash .splash-note:nth-of-type(3) { left:82%!important; top:34%!important; }
  #splash .splash-note:nth-of-type(4) { left:12%!important; top:41%!important; }
  #splash .splash-note:nth-of-type(5) { left:50%!important; top:36%!important; }
  #splash .splash-note:nth-of-type(6) { left:88%!important; top:41%!important; }
  #splash .splash-cta,#splash .splash-loading { z-index:3; }
  #splash:not(.is-art) .splash-stage,#splash:not(.is-art) .splash-brand { visibility:hidden; }
  #splash:not(.is-art) .splash-stage,#splash.is-hiding .splash-stage,#splash.is-hiding .splash-hearts i,#splash.is-hiding .splash-hearts i::after { animation-play-state:paused; }
  @media(prefers-reduced-motion:reduce) { #splash .splash-stage { animation:none; transform:translateX(calc((100vw - 100%)/2)); will-change:auto; } }
